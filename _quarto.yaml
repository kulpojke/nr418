project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - projects/annotations.qmd
    - projects/palstics.qmd

  resources:
    - projects
    - img
    - src/style

resource-path:
  - .
  - src

format:
  revealjs:
    theme: dracula
    slide-number: true
    controls: true
    progress: true
    hash: true
    center: true
    transition: slide
    background-transition: fade
    code-block-height: 500px

editor:
  render-on-save: true
